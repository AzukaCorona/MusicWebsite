<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Sight Reading Generator</title>
    <!-- VexFlow for Sheet Music Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <!-- Tone.js for Audio Playback & Metronome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        header { text-align: center; margin-bottom: 10px; }
        header h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 1rem; }
        
        .panel { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .control-group select, .control-group input { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-color); padding: 10px; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .control-group select:focus, .control-group input:focus { border-color: var(--accent); }
        
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem; font-weight: 500; height: 42px; }
        .checkbox-label input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

        .btn { background-color: var(--accent); color: #0f172a; border: none; padding: 11px 20px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
        .btn-secondary { background-color: #334155; color: var(--text-color); }
        .btn-secondary:hover { background-color: #475569; }
        
        .action-bar { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 5px; }

        .sheet-container { background: #ffffff; border-radius: 12px; padding: 20px; min-height: 250px; display: flex; justify-content: center; align-items: center; overflow-x: auto; position: relative; }
        #output { width: 100%; display: flex; justify-content: center; }
        #output svg { max-width: 100%; height: auto; }

        .piano-container { display: flex; justify-content: center; position: relative; background: #000; padding: 10px; border-radius: 8px; user-select: none; margin-top: 10px; overflow-x: auto; }
        .piano { display: flex; position: relative; height: 120px; }
        .key { position: relative; cursor: pointer; border-radius: 0 0 4px 4px; transition: background 0.1s; }
        .key.white { width: 36px; height: 120px; background: #fff; border: 1px solid #ccc; z-index: 1; }
        .key.white:hover, .key.white.active { background: #cbd5e1; }
        .key.black { width: 24px; height: 75px; background: #1e293b; position: absolute; z-index: 2; margin-left: -12px; border-radius: 0 0 3px 3px; border: 1px solid #000; }
        .key.black:hover, .key.black.active { background: #475569; }

        .status-msg { text-align: center; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Piano Sight Reader</h1>
            <p>Dynamic, musically-coherent practice sheets generated on the fly.</p>
        </header>

        <!-- Configuration Panel -->
        <div class="panel">
            <div class="controls-grid">
                <div class="control-group">
                    <label for="difficulty">Difficulty (1-4)</label>
                    <select id="difficulty">
                        <option value="1">Level 1: Quarters/Halves, 1 Hand</option>
                        <option value="2">Level 2: Adds Eighths & Rests</option>
                        <option value="3" selected>Level 3: Both Hands & Complex Rhythms</option>
                        <option value="4">Level 4: Full Range, Chords & Syncopation</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="clef">Clef Layout</label>
                    <select id="clef">
                        <option value="treble">Treble Clef Only</option>
                        <option value="bass">Bass Clef Only</option>
                        <option value="grand" selected>Grand Staff (Both)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="keySig">Key Signature</label>
                    <select id="keySig">
                        <option value="C" selected>C Major / A Minor</option>
                        <option value="G">G Major / E Minor</option>
                        <option value="F">F Major / D Minor</option>
                        <option value="D">D Major / B Minor</option>
                        <option value="Bb">Bb Major / G Minor</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="timeSig">Time Signature</label>
                    <select id="timeSig">
                        <option value="4/4" selected>4/4 Common Time</option>
                        <option value="3/4">3/4 Waltz Time</option>
                        <option value="2/4">2/4 March Time</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="tempo">Tempo (BPM)</label>
                    <input type="number" id="tempo" value="80" min="40" max="180">
                </div>

                <div class="control-group">
                    <label>Chords</label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeChords"> Include Harmonic Chords
                    </label>
                </div>
            </div>

            <div class="action-bar" style="margin-top: 20px;">
                <button class="btn" id="generateBtn">🔄 Generate New Piece</button>
                <button class="btn btn-secondary" id="playBtn" disabled>▶ Listen / Playback</button>
                <button class="btn btn-secondary" id="stopBtn" disabled>⏹ Stop</button>
            </div>
        </div>

        <!-- Sheet Music Display Panel -->
        <div class="panel">
            <div class="sheet-container">
                <div id="output"></div>
            </div>
            <div class="status-msg" id="statusMsg" style="margin-top: 10px;">Loading acoustic piano sound samples...</div>
        </div>

        <!-- Virtual Piano Keyboard Reference -->
        <div class="panel">
            <div class="piano-container">
                <div class="piano" id="virtualPiano"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPiece = null;
        let pianoSampler = null;
        let isPlaying = false;
        let samplesLoaded = false;

        // Initialize Real Acoustic Piano Sampler using Tone.js
        function initAudio() {
            if (!pianoSampler) {
                pianoSampler = new Tone.Sampler({
                    urls: {
                        "C4": "C4.mp3",
                        "Dis4": "Ds4.mp3",
                        "F#4": "Fs4.mp3",
                        "A4": "A4.mp3"
                    },
                    baseUrl: "https://tonejs.github.io/audio/salamander/",
                    onload: () => {
                        samplesLoaded = true;
                        document.getElementById('playBtn').disabled = false;
                        document.getElementById('statusMsg').textContent = "Piano loaded! Click 'Generate New Piece' to practice.";
                    }
                }).toDestination();
            }
        }

        // Setup Virtual Piano Keys
        function setupPiano() {
            const piano = document.getElementById('virtualPiano');
            const notes = [
                {note: 'C', type: 'white', octave: 3}, {note: 'C#', type: 'black', octave: 3, offset: 24},
                {note: 'D', type: 'white', octave: 3}, {note: 'D#', type: 'black', octave: 3, offset: 60},
                {note: 'E', type: 'white', octave: 3},
                {note: 'F', type: 'white', octave: 3}, {note: 'F#', type: 'black', octave: 3, offset: 132},
                {note: 'G', type: 'white', octave: 3}, {note: 'G#', type: 'black', octave: 3, offset: 168},
                {note: 'A', type: 'white', octave: 3}, {note: 'A#', type: 'black', octave: 3, offset: 204},
                {note: 'B', type: 'white', octave: 3},
                {note: 'C', type: 'white', octave: 4}, {note: 'C#', type: 'black', octave: 4, offset: 276},
                {note: 'D', type: 'white', octave: 4}, {note: 'D#', type: 'black', octave: 4, offset: 312},
                {note: 'E', type: 'white', octave: 4},
                {note: 'F', type: 'white', octave: 4}, {note: 'F#', type: 'black', octave: 4, offset: 384},
                {note: 'G', type: 'white', octave: 4}, {note: 'G#', type: 'black', octave: 4, offset: 420},
                {note: 'A', type: 'white', octave: 4}, {note: 'A#', type: 'black', octave: 4, offset: 456},
                {note: 'B', type: 'white', octave: 4},
                {note: 'C', type: 'white', octave: 5}
            ];

            piano.innerHTML = '';
            let whiteCount = 0;
            notes.forEach(k => {
                const keyEl = document.createElement('div');
                keyEl.className = `key ${k.type}`;
                if (k.type === 'white') {
                    keyEl.style.left = `${whiteCount * 36}px`;
                    whiteCount++;
                } else {
                    keyEl.style.left = `${k.offset}px`;
                }

                // Sharp format conversion for Tone.js sampler
                const fullNote = `${k.note.replace('#', 's')}${k.octave}`;
                keyEl.addEventListener('mousedown', () => {
                    initAudio();
                    if (samplesLoaded) {
                        pianoSampler.triggerAttackRelease(fullNote, '4n');
                    }
                    keyEl.classList.add('active');
                    setTimeout(() => keyEl.classList.remove('active'), 200);
                });
                piano.appendChild(keyEl);
            });
            piano.style.width = `${whiteCount * 36}px`;
        }

        // Music Generation Algorithm
        function generateMusic() {
            const difficulty = parseInt(document.getElementById('difficulty').value);
            const clefMode = document.getElementById('clef').value;
            const keySig = document.getElementById('keySig').value;
            const timeSig = document.getElementById('timeSig').value;
            const includeChords = document.getElementById('includeChords').checked;

            const [beatsPerBar, beatUnit] = timeSig.split('/').map(Number);
            const numBars = 6;

            const scales = {
                'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
                'G': ['C', 'D', 'E', 'F#', 'G', 'A', 'B'],
                'F': ['C', 'D', 'E', 'F', 'G', 'A', 'Bb'],
                'D': ['C#', 'D', 'E', 'F#', 'G', 'A', 'B'],
                'Bb': ['C', 'D', 'Eb', 'F', 'G', 'A', 'Bb']
            };
            const scaleNotes = scales[keySig] || scales['C'];

            let allowedDurations = ['q', 'h'];
            if (difficulty >= 2) allowedDurations.push('8');
            if (difficulty >= 3 && beatsPerBar >= 3) allowedDurations.push('hd');

            function createVoice(isBass) {
                let measures = [];
                let lastScaleIdx = 3;

                for (let b = 0; b < numBars; b++) {
                    let barNotes = [];
                    let currentBarBeats = 0;

                    while (currentBarBeats < beatsPerBar) {
                        let remainingBeats = beatsPerBar - currentBarBeats;
                        let validDurs = allowedDurations.filter(d => {
                            let durBeats = d === 'q' ? 1 : d === 'h' ? 2 : d === 'hd' ? 3 : d === '8' ? 0.5 : 1;
                            return durBeats <= remainingBeats;
                        });
                        if (validDurs.length === 0) validDurs = ['q'];
                        let dur = validDurs[Math.floor(Math.random() * validDurs.length)];
                        let durBeats = dur === 'q' ? 1 : dur === 'h' ? 2 : dur === 'hd' ? 3 : dur === '8' ? 0.5 : 1;

                        let step = Math.floor(Math.random() * 3) - 1;
                        lastScaleIdx = Math.max(0, Math.min(scaleNotes.length - 1, lastScaleIdx + step));
                        let noteName = scaleNotes[lastScaleIdx];

                        let octave = isBass ? (difficulty > 2 && Math.random() > 0.5 ? 3 : 2) : (difficulty > 3 && Math.random() > 0.6 ? 5 : 4);
                        if (clefMode === 'treble') octave = 4;
                        if (clefMode === 'bass') octave = 3;

                        let noteString = `${noteName.toLowerCase()}${octave}/${dur}`;
                        
                        if (includeChords && difficulty >= 3 && Math.random() < 0.25 && dur !== '8') {
                            let thirdIdx = (lastScaleIdx + 2) % scaleNotes.length;
                            let chordNote = `${scaleNotes[thirdIdx].toLowerCase()}${octave}`;
                            noteString = `${noteName.toLowerCase()}${octave}+${chordNote}/${dur}`;
                        }

                        barNotes.push({ note: noteString, duration: dur, beats: durBeats });
                        currentBarBeats += durBeats;
                    }
                    measures.push(barNotes);
                }
                return measures;
            }

            let trebleMeasures = (clefMode === 'treble' || clefMode === 'grand') ? createVoice(false) : null;
            let bassMeasures = (clefMode === 'bass' || clefMode === 'grand') ? createVoice(true) : null;

            currentPiece = { timeSig, keySig, clefMode, trebleMeasures, bassMeasures, numBars };
            renderSheetMusic();
            document.getElementById('statusMsg').textContent = "Piece generated! Ready for playback.";
        }

        // Render Sheet Music using VexFlow 4 Factory API
        function renderSheetMusic() {
            const output = document.getElementById('output');
            output.innerHTML = '';

            if (!currentPiece) return;

            const { Renderer, Factory, Stave, StaveConnector, BarLine } = VexFlow;
            
            const width = Math.max(750, currentPiece.numBars * 130 + 100);
            const height = currentPiece.clefMode === 'grand' ? 260 : 180;

            const renderer = new Renderer(output, Renderer.Backends.SVG);
            renderer.resize(width, height);
            const context = renderer.getContext();

            const factory = new Factory({ renderer: { elementId: 'output', width, height } });
            const score = factory.EasyScore();

            let xPos = 10;
            let staveWidth = 130;

            for (let i = 0; i < currentPiece.numBars; i++) {
                if (currentPiece.clefMode === 'grand') {
                    const trebleStave = new Stave(xPos, 20, staveWidth);
                    const bassStave = new Stave(xPos, 120, staveWidth);

                    if (i === 0) {
                        trebleStave.addClef('treble').addKeySignature(currentPiece.keySig).addTimeSignature(currentPiece.timeSig);
                        bassStave.addClef('bass').addKeySignature(currentPiece.keySig).addTimeSignature(currentPiece.timeSig);
                        trebleStave.setBegBarType(BarLine.type.REPEAT_BEGIN);
                        bassStave.setBegBarType(BarLine.type.REPEAT_BEGIN);
                    }
                    if (i === currentPiece.numBars - 1) {
                        trebleStave.setEndBarType(BarLine.type.END);
                        bassStave.setEndBarType(BarLine.type.END);
                    }

                    trebleStave.setContext(context).draw();
                    bassStave.setContext(context).draw();

                    if (currentPiece.trebleMeasures && currentPiece.trebleMeasures[i]) {
                        let noteStrs = currentPiece.trebleMeasures[i].map(n => n.note).join(', ');
                        let voice = score.voice(score.notes(noteStrs, { stem: 'up' }));
                        let formatter = new VexFlow.Formatter().joinVoices([voice]);
                        formatter.format([voice], staveWidth - 40);
                        voice.draw(context, trebleStave);
                    }

                    if (currentPiece.bassMeasures && currentPiece.bassMeasures[i]) {
                        let noteStrs = currentPiece.bassMeasures[i].map(n => n.note).join(', ');
                        let voice = score.voice(score.notes(noteStrs, { stem: 'down' }));
                        let formatter = new VexFlow.Formatter().joinVoices([voice]);
                        formatter.format([voice], staveWidth - 40);
                        voice.draw(context, bassStave);
                    }

                    if (i === 0) {
                        const connector = new StaveConnector(trebleStave, bassStave);
                        connector.setX(trebleStave.getX());
                        connector.setType('brace');
                        connector.setContext(context).draw();
                        const lineConnector = new StaveConnector(trebleStave, bassStave);
                        lineConnector.setType('single');
                        lineConnector.setContext(context).draw();
                    }

                } else {
                    const clefType = currentPiece.clefMode;
                    const stave = new Stave(xPos, 40, staveWidth);

                    if (i === 0) {
                        stave.addClef(clefType).addKeySignature(currentPiece.keySig).addTimeSignature(currentPiece.timeSig);
                        stave.setBegBarType(BarLine.type.REPEAT_BEGIN);
                    }
                    if (i === currentPiece.numBars - 1) {
                        stave.setEndBarType(BarLine.type.END);
                    }
                    stave.setContext(context).draw();

                    let measuresData = clefType === 'treble' ? currentPiece.trebleMeasures : currentPiece.bassMeasures;
                    if (measuresData && measuresData[i]) {
                        let noteStrs = measuresData[i].map(n => n.note).join(', ');
                        let voice = score.voice(score.notes(noteStrs));
                        let formatter = new VexFlow.Formatter().joinVoices([voice]);
                        formatter.format([voice], staveWidth - 40);
                        voice.draw(context, stave);
                    }
                }

                xPos += staveWidth;
            }
        }

        // Playback Functionality
        async function startPlayback() {
            if (!currentPiece || !samplesLoaded) return;
            initAudio();
            await Tone.start();

            if (isPlaying) stopPlayback();

            const bpm = parseInt(document.getElementById('tempo').value) || 80;
            Tone.Transport.bpm.value = bpm;

            // Combine treble and bass notes for playback
            let timeOffset = 0;
            const beatDuration = 60 / bpm;

            isPlaying = true;
            document.getElementById('playBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusMsg').textContent = "Playing preview with grand piano samples...";

            for (let i = 0; i < currentPiece.numBars; i++) {
                let trebleBar = currentPiece.trebleMeasures ? currentPiece.trebleMeasures[i] : [];
                let bassBar = currentPiece.bassMeasures ? currentPiece.bassMeasures[i] : [];
                
                // Assuming uniform bar lengths across voices, take treble or bass length
                let maxSteps = Math.max(trebleBar.length, bassBar.length);
                
                // For simplicity in playback scheduling, step through notes or group by beat positions. 
                // Let's build a timeline map per bar.
                let barEvents = {};
                
                if (trebleBar) {
                    let tCursor = 0;
                    trebleBar.forEach(item => {
                        if (!barEvents[tCursor]) barEvents[tCursor] = [];
                        let notes = item.note.split('/')[0].split('+').map(n => {
                            let clean = n.trim();
                            let pitch = clean.slice(0, -1);
                            let octave = clean.slice(-1);
                            return pitch.replace('#', 's').toUpperCase() + octave;
                        });
                        barEvents[tCursor].push({ notes, duration: item.beats * beatDuration });
                        tCursor += item.beats;
                    });
                }

                if (bassBar) {
                    let tCursor = 0;
                    bassBar.forEach(item => {
                        if (!barEvents[tCursor]) barEvents[tCursor] = [];
                        let notes = item.note.split('/')[0].split('+').map(n => {
                            let clean = n.trim();
                            let pitch = clean.slice(0, -1);
                            let octave = clean.slice(-1);
                            return pitch.replace('#', 's').toUpperCase() + octave;
                        });
                        barEvents[tCursor].push({ notes, duration: item.beats * beatDuration });
                        tCursor += item.beats;
                    });
                }

                let barStartOffset = timeOffset;
                let beatsInBar = parseInt(currentPiece.timeSig.split('/')[0]);

                // Schedule events in this bar
                Object.keys(barEvents.length ? barEvents : {}).forEach(beatOffset => {
                    let offsetVal = parseFloat(beatOffset);
                    let eventsAtBeat = barEvents[beatOffset];

                    Tone.Transport.schedule((time) => {
                        eventsAtBeat.forEach(ev => {
                            pianoSampler.triggerAttackRelease(ev.notes, ev.duration * 0.9, time);
                        });
                    }, barStartOffset + (offsetVal * beatDuration));
                });

                timeOffset += beatsInBar * beatDuration;
            }

            Tone.Transport.schedule((time) => {
                stopPlayback();
            }, timeOffset);

            Tone.Transport.start();
        }

        function stopPlayback() {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            isPlaying = false;
            if (samplesLoaded) document.getElementById('playBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusMsg').textContent = "Playback finished.";
        }

        // Event listeners
        document.getElementById('generateBtn').addEventListener('click', generateMusic);
        document.getElementById('playBtn').addEventListener('click', startPlayback);
        document.getElementById('stopBtn').addEventListener('click', stopPlayback);

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            setupPiano();
            initAudio();
            generateMusic();
        });
    </script>
</body>
</html>
